# ============================================================
# dtm-ndt-pod.yaml — DTM + NDT Pod (mode 1:1)
#
# NDT (on_ndt.py --role ndt) and DTM agent (dtm.py --mode agent)
# run together because dtm.py calls on_ndt.py primitives via
# localhost:6001. localhost is shared within the same Pod.
#
# In 1:1 mode the DTM core (svc-dtm:7001) forwards events
# directly to this Pod. The agent applies them on the local NDT
# and does NOT send ACKs (no feedback loop in 1:1 mode).
#
# Access NDT Mininet:
#   kubectl exec -it pod-dtm-ndt -n ndt -c ndt -- bash
#   mnexec -a $(pgrep -f "mininet:r1") ip route
#
# View DTM agent logs:
#   kubectl logs pod-dtm-ndt -n ndt -c dtm
# ============================================================

apiVersion: v1
kind: Pod
metadata:
  name: pod-dtm-ndt
  namespace: ndt
  labels:
    app: dtm-ndt
    mode: "1-1"
spec:
  restartPolicy: Never

  volumes:
    - name: on-ndt-script
      configMap:
        name: on-ndt-script
        defaultMode: 493
    - name: topology-config
      configMap:
        name: topology-config
    - name: logs
      emptyDir: {}

  containers:

    # ── Container 1: NDT (Mininet keeper) ─────────────────
    # Starts OVS + Mininet, exposes API on localhost:6001.
    # dtm-agent calls this API to apply events.
    - name: ndt
      image: on-mininet:1.0
      imagePullPolicy: Never
      securityContext:
        privileged: true
      env:
        - name: CTRL_PORT
          value: "6653"
      volumeMounts:
        - name: on-ndt-script
          mountPath: /app/on_ndt.py
          subPath: on_ndt.py
        - name: topology-config
          mountPath: /run/topology_config.json
          subPath: topology.json
        - name: logs
          mountPath: /app/logs

    # ── Container 2: DTM agent ────────────────────────────
    # Receives events from DTM core (svc-dtm:7001).
    # Applies them on local NDT via localhost:6001.
    # No ACKs in 1:1 mode (--dtm-ip is empty).
    - name: dtm
      image: dtm:1.0
      imagePullPolicy: Never
      args:
        - "--proto"
        - "udp"
        - "--relay-ip"
        - "0.0.0.0"
        - "--relay-port"
        - "7001"
        - "--mode"
        - "agent"
        - "--dtm-ip"
        - ""
        - "--log-file"
        - "/app/logs/dtm-agent.log"
      volumeMounts:
        - name: logs
          mountPath: /app/logs
---
apiVersion: v1
kind: Service
metadata:
  name: svc-dtm
  namespace: ndt
  labels:
    app: dtm-ndt
spec:
  type: ClusterIP
  selector:
    app: dtm-ndt
  ports:
    - name: relay-udp
      protocol: UDP
      port: 7001
      targetPort: 7001